# Wavedash publishing config (https://docs.wavedash.com/cli/configuration).
# `wavedash init` writes this file interactively; it is checked in so the upload is reproducible.
# game_id is the PRISM game on the CommendableBard71 team (`wavedash project list --team-id <id>`).
#
# Authenticate with your own API key, which never belongs in this file or the repo:
#   $env:WAVEDASH_TOKEN = "wd_..."          # PowerShell, this session only
#   node build.js -O2 --wavedash            # writes dist/wavedash/index.html (the Wavedash build, not the js13k zip)
#   wavedash build push -m "js13k 2026 entry"
#   wavedash publish <BUILD_ID>
game_id = "j97ddpqsg8v73xn49hp7pqfx0x8dr30z"

# The Wavedash build (achievements, leaderboards, SDK init — code the js13k competition zip does not carry),
# alone in its own folder so nothing else is uploaded.
upload_dir = "./dist/wavedash"
entrypoint = "index.html"
